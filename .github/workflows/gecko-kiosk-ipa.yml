name: Gecko Kiosk iOS dylib
on:
  push:
    branches:
      - gecko-kiosk-ipa-experiment
    paths:
      - 'gecko-kiosk/**'
      - '.github/workflows/gecko-kiosk-ipa.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS Gecko Kiosk extension
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gecko-kiosk/GeckoKiosk.m')
          s=p.read_text()
          s=s.replace('GeckoURLContext *ctx=[GeckoURLContext new];','GeckoURLContext *ctx=class_createInstance(GeckoURLContext.class,0);')
          s=s.replace('[name hasSuffix:@"ContentView"]])','[name hasSuffix:@"ContentView"])')
          p.write_text(s)
          PY
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -x objective-c -fobjc-arc -fblocks -dynamiclib \
            -Wl,-install_name,@executable_path/Frameworks/GeckoKiosk.dylib \
            gecko-kiosk/GeckoKiosk.m \
            -framework Foundation -framework UIKit -lobjc \
            -o gecko-kiosk/GeckoKiosk.dylib
          file gecko-kiosk/GeckoKiosk.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: GeckoKiosk-iOS-arm64
          path: gecko-kiosk/GeckoKiosk.dylib
          retention-days: 7
